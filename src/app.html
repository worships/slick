<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#07070b" />
		<link rel="icon" id="favicon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
		<script>
			// apply accent + cloak before first paint
			try {
				var s = JSON.parse(localStorage.getItem('slick:settings') || '{}');
				if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
				if (s.cloak && s.cloak.enabled && s.cloak.mode === 'always') {
					if (s.cloak.title) document.title = s.cloak.title;
					if (s.cloak.icon) document.getElementById('favicon').href = s.cloak.icon;
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
